<ion-content [fullscreen]="true" [scrollY]="false">
  <app-menu-button slot="fixed"></app-menu-button>
  <section class="douyin" (scrollend)="onScrollEnd($event)">
    @for (video of videos(); track video.id) {
    <div class="slide">
      @if (video.videoType === "extern") { @if (video.photo === null) {
      <img src="assets/actress/sexy-blonde-big-kiss.gif" alt="" />
      } @else {
      <img [src]="s3Url + '/' + s3Root + '/' + video.photo.name" alt="" />
      } } @else {
      <iframe
        #player
        class="w-full min-h-[200px] border-none block"
        [src]="playerUrl"
        allowfullscreen
        (load)="onPlayerLoad($event, $index)"
      ></iframe>
      }
    </div>
    }

    <ion-fab slot="fixed" vertical="bottom" horizontal="end" class="bottom-1/3">
      <ion-fab-button>
        <ion-icon name="chevron-up-circle"></ion-icon>
      </ion-fab-button>
      <ion-fab-list side="top">
        <ion-fab-button>
          <a
            class="actress-profile h-[50px] w-[50px] rounded-full overflow-hidden"
            [title]="videos()[videoIndex]?.actress?.name ?? ''"
          >
            @if (videos()[videoIndex]?.actress?.photo; as photo) {
              <img [src]="s3Url + '/' + s3Root + '/' + photo.name" alt="" class="object-cover" />
            }
          </a>
        </ion-fab-button>
      </ion-fab-list>
    </ion-fab>
  </section>
</ion-content>
