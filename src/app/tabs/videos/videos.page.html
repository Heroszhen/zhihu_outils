<ion-content [fullscreen]="true" [scrollY]="false">
  <app-menu-button slot="fixed"></app-menu-button>

  <section class="douyin ion-content-scroll-host" (scrollend)="onScrollEnd($event)">
    @for (video of videos(); track video.id) {
    <div class="slide">
      @if (video.videoType === "extern") { @if (video.photo === null) {
      <img src="assets/actress/sexy-blonde-big-kiss.gif" alt="" />
      } @else {
      <img [src]="s3Url + '/' + s3Root + '/' + video.photo.name" alt="" />
      } } @else {
      <app-video-player [video]="video" [index]="$index" [currentIndex]="videoIndex()" />
      }
    </div>
    }

    <ion-fab slot="fixed" vertical="bottom" horizontal="end" class="bottom-1/3">
      <ion-fab-button class="fab-transparent">
        <ion-icon name="chevron-up-circle"></ion-icon>
      </ion-fab-button>
      <ion-fab-list side="top">
        @let index = videoIndex(); @if (index !== null) { @if (videos()[index]; as video ) {
        <ion-fab-button>
          <a [href]="video.website" target="_blank" [title]="video.title">
            <ion-icon name="arrow-up-right-box-outline"></ion-icon>
          </a>
        </ion-fab-button>
        <ion-fab-button>
          <a class="actress-profile h-[50px] w-[50px] rounded-full overflow-hidden" [title]="video.actress.name">
            @if (video.actress.photo; as photo) {
            <img [src]="s3Url + '/' + s3Root + '/' + photo.name" alt="" class="object-cover h-full" />
            }
          </a>
        </ion-fab-button>
        } }
      </ion-fab-list>
    </ion-fab>
  </section>
</ion-content>
